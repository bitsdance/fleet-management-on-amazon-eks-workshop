global:
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

# Define domain filters directly in values since the annotation is missing
domainFilters:
  - "bitsdance.com"  # Replace with your actual domain

# Use AWS Route53 as the DNS provider
provider: aws

# Configure policy to sync records
policy: sync

# Set registry to track ownership of records
registry: txt
txtOwnerId: "eks-fleet"

# Define service account configuration directly
serviceAccount:
  create: true
  name: "external-dns-sa"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::367123725217:role/ExternalDNSRole-eksfleet"  # This will use Pod Identity instead